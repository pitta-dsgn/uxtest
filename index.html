const image=(id,cls='')=>`<img src="${embeddedImages[id]}" alt="" class="${cls}" draggable="false">`;
const entries=()=>Object.entries(state.quantities).filter(([id,q])=>products[id]&&q>0&&!ui.removed[id]).map(([id,q])=>({...products[id],qty:q}));
const sum=(items,field='price')=>items.reduce((n,p)=>n+p[field]*p.qty,0);
const count=items=>items.reduce((n,p)=>n+p.qty,0);
const noun=n=>n%10===1&&n%100!==11?'товар':n%10>=2&&n%10<=4&&(n%100<12||n%100>14)?'товара':'товаров';
function save(){try{sessionStorage.setItem('april-uxtest-v1',JSON.stringify(state));}catch{}}
function toast(message){const t=document.getElementById('toast');t.textContent=message;t.classList.add('visible');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.remove('visible'),2400);}
function button(label,action,cls='',extra=''){return `<button type="button" class="button ${cls}" data-action="${action}" ${extra}>${label}</button>`;}
function nav(){const n=count(entries());return `<nav class="bottom-nav" aria-label="Нижнее меню">${[['catalog','Каталог'],['offers','Акции'],['home','Главная'],['cart','Корзина'],['profile','Профиль']].map(([id,label])=>`<button type="button" class="nav-item ${id==='cart'?'active':''}" ${id==='cart'?'data-action="cart"':''} aria-label="${label}">${image(id)}<span>${label}</span>${id==='cart'&&n?`<span class="badge">${n}</span>`:''}</button>`).join('')}</nav>`;}
function header(title,back){return `<header class="app-header">${back?`<button class="icon-button back" data-action="${back}" aria-label="Назад">${image('back')}</button>`:''}<h1>${title}</h1></header>`;}
function price(p){return `<div class="price-row"><strong class="price pink">${money(p.price*p.qty)}</strong><span class="price-hint">с клубной картой</span></div><div class="price-hint">${money(p.regular*p.qty)} без карты</div>`;}
function cartCard(p){const removed=!!ui.removed[p.id];return `<article class="cart-item ${removed?'removed':''}" data-product="${p.id}"><div class="product-info"><div class="product-image">${image(p.id,p.id)}</div><div class="product-details"><p class="product-name">${esc(p.name)}</p>${p.rx?'<span class="prescription">По рецепту</span>':''}${price(p)}</div></div><div class="product-actions"><div class="action-pair"><button class="icon-button pale" data-action="favorite-product" aria-label="В избранное" ${removed?'disabled':''}>${image('heart')}</button>${removed?'':`<button class="icon-button pale" data-action="remove" data-id="${p.id}" aria-label="Удалить ${esc(p.name)}">${image('trash')}</button>`}</div>${removed?button('Вернуть','restore','secondary-button restore',`data-id="${p.id}"`):`<div class="counter"><button data-action="decrease" data-id="${p.id}" aria-label="Уменьшить количество">−</button><output aria-label="Количество">${p.qty}</output><button data-action="increase" data-id="${p.id}" aria-label="Увеличить количество">+</button></div>`}</div></article>`;}
function offer(id){const p={...products[id],qty:1};return `<article class="offer"><div class="product-image">${image(id)}</div><p>${esc(p.name)}</p><div>${price(p)}</div>${button('Добавить','add','outline',`data-id="${id}"`)}</article>`;}

function miniProduct(p,status){const cls=status==='Под заказ'?'preorder':status==='Временно отсутствует'?'missing':'';return `<article class="mini-product ${cls}"><div class="mini-image">${image(p.id)}</div><div class="mini-details"><p class="mini-name">${esc(p.name)}</p><p class="mini-status ${status==='Под заказ'?'orange':status==='Временно отсутствует'?'red':'green'}">${status}</p></div><span class="mini-qty">×${p.qty}</span></article>`;}
function miniList(pharmacy){return `<div class="mini-list">${entries().map(p=>miniProduct(p,p.id==='sinus'&&pharmacy.id==='sun'?'Под заказ':p.id==='sinus'&&pharmacy.id==='hospital'?'Временно отсутствует':'В наличии')).join('')}</div>`;}
function availability(pharmacy,expandable=true){let status=pharmacy.status,color=pharmacy.color;if(!entries().some(p=>p.id==='sinus')){status='Все в наличии';color='green';}return `<button type="button" class="availability ${color} ${ui.openRows.has(pharmacy.id)?'open':''}" ${expandable&&status!=='Все в наличии'?`data-action="expand-row" data-id="${pharmacy.id}" aria-expanded="${ui.openRows.has(pharmacy.id)}"`:''}>${status}${expandable&&status!=='Все в наличии'?image('chevron'):''}</button>`;}
function pharmacyRow(p){return `<article class="pharmacy-row"><div class="address-row"><div>${p.id==='sun'?`<button class="address" data-action="select-pharmacy">${p.address}</button>`:`<p class="address">${p.address}</p>`}<p class="pharmacy-meta">${p.hours}${p.distance?' · '+p.distance:''}</p></div><button class="bookmark ${ui.saved.has(p.id)?'saved':''}" data-action="bookmark" data-id="${p.id}" aria-label="${ui.saved.has(p.id)?'Убрать из избранного':'Добавить в избранное'}" aria-pressed="${ui.saved.has(p.id)}">${image('bookmark')}</button></div>${availability(p)}${ui.openRows.has(p.id)?miniList(p):''}</article>`;}
function normalize(s){return s.toLocaleLowerCase('ru').replace(/ё/g,'е').replace(/[^а-яa-z0-9]+/g,' ').trim();}
function filteredPharmacies(){const tokens=normalize(ui.query).split(' ').filter(Boolean);return pharmacies.filter(p=>(!ui.favorites||ui.saved.has(p.id))&&tokens.every(t=>normalize(p.address).includes(t)));}
function listHtml(){const list=filteredPharmacies();return list.length?list.map(pharmacyRow).join(''):`<div class="no-results"><h2>${ui.favorites&&!ui.query?'Нет избранных аптек':'Аптеки не найдены'}</h2><p style="margin-top:8px">${ui.favorites&&!ui.query?'Добавьте аптеку в избранное с помощью закладки':'Проверьте адрес или измените запрос'}</p>${ui.favorites?button('Показать все аптеки','all-pharmacies','secondary-button'):''}</div>`;}

function checkoutProduct(p){return `<article class="checkout-product"><div class="mini-image">${image(p.id)}</div><div><p class="name">${esc(p.name)}</p><p class="amount">${money(p.price*p.qty)}</p></div><span class="quantity-small">×${p.qty}</span></article>`;}
function orderGroups(){const active=entries(),stock=active.filter(p=>p.id!=='sinus'),preorder=active.filter(p=>p.id==='sinus');if(state.mode==='split')return[{title:`Заказ 1 · <span class="green">В наличии · ${count(stock)}</span>`,items:stock},{title:`Заказ 2 · <span class="orange">Под заказ · ${count(preorder)}</span>`,items:preorder}].filter(g=>g.items.length);if(state.mode==='stock')return[{title:`Товары · ${count(stock)}`,items:stock}];return[{title:`Товары · ${count(active)}`,items:active}];}
function chosenProducts(){return state.mode==='stock'?entries().filter(p=>p.id!=='sinus'):entries();}
function checkout(){const p=pharmacies[0],items=chosenProducts(),rx=items.some(p=>p.rx),hasPreorder=entries().some(p=>p.id==='sinus');if(!hasPreorder&&!state.mode)state.mode='together';const modes=[['stock','Только товары в наличии',''],['together','Все товары одним заказом','Все товары будут доступны к получению после поступления недостающих товаров в аптеку'],['split','Двумя заказами','Товары в наличии и под заказ будут оформлены отдельными заказами']];const discount=state.promo?200:0;
app.innerHTML=header('Оформление','back-map')+`<div class="scroll checkout-scroll" id="main-scroll"><section class="block"><div class="block-header"><h2>Выбранная аптека</h2><button class="link" data-action="change-pharmacy">Изменить</button></div><p class="checkout-address">${p.address}</p><p class="checkout-meta">${p.hours} · ${p.distance}</p><p class="availability ${hasPreorder?'orange':'green'}">${hasPreorder?'1 товар под заказ':'Все в наличии'}</p></section><section class="block"><h2 style="margin-bottom:12px">Телефон получателя</h2><p class="phone-number">+7 953 346-51-84</p><p class="muted">Проверьте номер: на него придёт уведомление о заказе</p></section>${hasPreorder?`<section class="block"><h2 style="margin-bottom:12px">Способ оформления</h2><div class="options" role="radiogroup" aria-label="Способ оформления">${modes.map(([id,title,description])=>`<button class="option ${state.mode===id?'selected':''}" role="radio" aria-checked="${state.mode===id}" data-action="mode" data-id="${id}"><span class="radio"></span><div><p class="option-title">${title}</p>${state.mode===id&&description?`<p class="option-description">${description}</p>`:''}</div></button>`).join('')}</div></section>`:''}${orderGroups().map(g=>`<section class="block"><h2 class="order-group-title">${g.title}</h2>${g.items.map(checkoutProduct).join('')}</section>`).join('')}<section class="block compact">${state.promo?`<h2 style="margin-bottom:12px">Промокод применён</h2><div class="promo-actions"><span>APRIL200</span><div><button class="link" data-action="promo">Изменить</button><button class="link" data-action="remove-promo">Удалить</button></div></div>`:`<button class="block-header" style="width:100%;margin:0;padding:0" data-action="promo"><h2>Есть промокод?</h2><span class="blue">›</span></button>`}</section><section class="block"><h2>Способ оплаты</h2>${[['pickup','При получении в аптеке'],['online','Картой онлайн'],['sbp','Через СБП']].map(([id,label])=>`<button class="payment-row ${state.payment===id?'selected':''} ${rx&&id!=='pickup'?'disabled':''}" style="width:100%;text-align:left;padding:0" role="radio" aria-checked="${state.payment===id}" data-action="payment" data-id="${id}" ${rx&&id!=='pickup'?'disabled':''}><span class="radio"></span><span>${label}</span></button>`).join('')}${rx?'<p class="muted">Онлайн-оплата и СБП недоступны: в заказе есть рецептурный препарат</p>':''}</section><section class="block"><h2 style="margin-bottom:12px">Сумма заказа</h2><div class="total-row"><span>${count(items)} ${noun(count(items))}</span><span>${money(sum(items,'regular'))}</span></div><div class="total-row"><span>Выгода с клубной картой</span><span class="pink">−${money(sum(items,'regular')-sum(items))}</span></div>${state.promo?'<div class="total-row"><span>Скидка по промокоду</span><span>−200 ₽</span></div>':''}${state.mode==='split'?`<div class="total-row"><span>Заказ 1</span><span>${money(sum(items.filter(p=>p.id!=='sinus'))-discount)}</span></div><div class="total-row"><span>Заказ 2</span><span>${money(sum(items.filter(p=>p.id==='sinus')))}</span></div>`:''}<div class="total-row big"><span>Итого</span><strong>${money(sum(items)-discount)}</strong></div>${button(state.mode?(state.mode==='split'?'Оформить 2 заказа':'Оформить заказ'):'Выберите способ оформления','submit','',!state.mode?'disabled':'')}</section></div>`;
}
function orderCard(order,index){return `<section class="block"><h2 style="margin-bottom:8px">Заказ №${242246406+index*2}</h2><p class="${order.preorder?'orange':'green'}" style="margin-bottom:8px">${order.preorder?'Товары под заказ':'Товары в наличии'}</p>${order.items.map(checkoutProduct).join('')}${order.discount?`<div class="total-row"><span>Скидка по промокоду</span><span>−${money(order.discount)}</span></div>`:''}<div class="total-row" style="margin:16px 0"><span>К оплате</span><strong style="font-size:20px;line-height:28px">${money(sum(order.items)-(order.discount||0))}</strong></div>${button(order.cancelled?'Заказ отменён':'Отменить заказ','cancel-order','secondary-button',`data-id="${index}" ${order.cancelled?'disabled':''}`)}</section>`;}
function complete(){if(!state.orders){navigate('checkout',true);return;}const orders=state.orders;app.innerHTML=`<div class="scroll confirmation-scroll" id="main-scroll"><section class="block"><div class="success-heading"><span class="confirmation-icon">✓</span><h1>${orders.length===2?'Оформлены 2 заказа':'Заказ оформлен'}</h1></div><p class="blue" style="font-weight:500;margin-bottom:8px">${orders.length===2?'Заказы находятся в обработке':'Заказ находится в обработке'}</p><p class="secondary">${orders.length===2?'Уведомления о готовности каждого заказа поступят':'Уведомление о готовности заказа поступит'} на +7 953 346-51-84</p></section><section class="block"><h2 style="margin-bottom:12px">Выбранная аптека</h2><p class="checkout-address">${pharmacies[0].address}</p><p class="checkout-meta">${pharmacies[0].hours} · ${pharmacies[0].distance}</p><p class="secondary" style="margin-top:12px">${state.payment==='pickup'?'Оплата при получении в аптеке':state.payment==='online'?'Оплата картой онлайн':'Оплата через СБП'}</p></section>${orders.map(orderCard).join('')}<section class="block marketing"><img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAVIAAABkCAYAAADUgbjrAAAACXBIWXMAAAPoAAAD6AG1e1JrAAAgAElEQVR4XtS9d5ClyXEn9nv+tfc9Mz3ez3qL3QXWYhe78ABBA4I8ksBJJGh0Eo8KKRR3EfpHoaCoEE8h8agjI4jg8Y4UjgaGMLsAgfVY792YHe+ne9r7fvZTZFZmVdb3Xs8OeLw/VLvT7/vKZGWlqyz7ZZIkScChCWAWaC4AkKj/XwdtQwbQJmbgnxN9lV+lwNWCbPusEJIY/k8fCED7kunYuJ6rre0DYCcfgHu6cUrAdQtkPuBd4zLtacu/2fWLJ1KuLdx0XrTltotuumiPg8uTMD+aaKLWAouqDgDoTxvO66MVtrbyczUhll8KmUweHd37kcmU8Z8TqtVLWFs9n4r9qZBbJ7TCSJoJMsTSZptU2zgb91Nqw5UCcTa7rt63wgm6kUG5YxM6OrYjww1wIe+zJaeQNA4igwrrcCZjkXFAg25nkCH7xOVUhjNSvctH6ZYaZK9dGS7t4yiSqkoyCf/6/JxZIuRZYbp6CQd+WkcoDREkU4ZwVJhJwnUwXlY828CSWgKc9ao05W0ZxtuAdi9JsAG+zPpwlJJND09TTJnUj3CtDbKBR54eESRqo9DKlPF/fRlfQ3jnih22DIN/s6ZIJrRGDaA1hCokXFAEVfNwyDo++oRQ3smVpNnyHnentRmmnatEf5meSVPa7nJrfvfcQLOxCjQrrpSln6LGYAzNPN9TTOFnw21+FkGI2BFoLixvYTDBzmY7kc13odyxB//YkCR1LM6+hsXFV70OS4qjqZUTwTPglXi2+Y5IygY6RY2QMgGukix+D0S0 function ordersPage(){app.innerHTML=header('Мои заказы','complete')+`<div class="scroll confirmation-scroll">${(state.orders||[]).map(orderCard).join('')}</div>${nav()}`;}
function render(preserve=false){const scroll=preserve?document.getElementById('main-scroll')?.scrollTop||0:0;document.getElementById('phone').classList.remove('map-active');if(ui.route==='pharmacies')map();else if(ui.route==='checkout')checkout();else if(ui.route==='complete')complete();else if(ui.route==='orders')ordersPage();else cart();if(preserve){const el=document.getElementById('main-scroll');if(el)el.scrollTop=scroll;}save();}
function navigate(route,replace=false){ui.route=route;if(replace)history.replaceState(null,'','#'+route);else if(location.hash!=='#'+route)history.pushState(null,'','#'+route);document.getElementById('overlay-root').innerHTML='';render();}
function promoDialog(value=state.promo?'APRIL200':'',error=false){const root=document.getElementById('overlay-root');root.innerHTML=`<div class="dialog-backdrop" data-action="close-dialog"><form class="dialog" id="promo-form"><div class="handle"><span></span></div><div class="dialog-header"><h2>Промокод</h2><button type="button" class="icon-button" data-action="close-dialog" aria-label="Закрыть">×</button></div><input name="code" type="text" autocapitalize="characters" autocomplete="off" spellcheck="false" placeholder="Введите промокод" value="${esc(value)}" aria-label="Промокод" ${error?'aria-invalid="true" aria-describedby="promo-error"':''}>${error?'<p class="error" id="promo-error">Промокод не найден. Проверьте код</p>':''}<button class="button" type="submit">Применить</button></form></div>`;root.querySelector('input').focus();}
document.addEventListener('submit',e=>{if(e.target.id!=='promo-form')return;e.preventDefault();const code=new FormData(e.target).get('code').trim().toUpperCase();if(code==='APRIL200'){state.promo=true;document.getElementById('overlay-root').innerHTML='';render(true);}else promoDialog(code,true);});
document.addEventListener('input',e=>{if(e.target.id!=='pharmacy-search')return;ui.query=e.target.value;ui.collapsed=false;ui.expanded=true;const sheet=e.target.closest('.sheet');sheet.classList.add('expanded');sheet.classList.remove('collapsed');document.getElementById('pharmacy-results').innerHTML=listHtml();});
document.addEventListener('focusin',e=>{if(e.target.id==='pharmacy-search'){ui.expanded=true;e.target.closest('.sheet').classList.add('expanded');}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const a=b.dataset.action,id=b.dataset.id;if(a==='close-dialog'&&e.target.closest('.dialog')&&b.classList.contains('dialog-backdrop'))return;
if(a==='cart')navigate('cart');else if(a==='start-map'){ui.selected=false;ui.query='';ui.expanded=false;ui.collapsed=false;navigate('pharmacies');}
else if(a==='select-pharmacy'){ui.selected=true;document.activeElement?.blur();render();}
else if(a==='back-list'){ui.selected=false;render();}else if(a==='back-map'||a==='change-pharmacy'){ui.selected=true;navigate('pharmacies');}
else if(a==='choose-pharmacy'){state.chosen=true;navigate('checkout');}
else if(a==='expand-sheet'){ui.expanded=true;ui.collapsed=false;render();}else if(a==='toggle-sheet'){if(ui.selected){ui.selected=false;ui.expanded=true;ui.collapsed=false;}else if(ui.collapsed){ui.collapsed=false;ui.expanded=true;}else if(ui.expanded){ui.expanded=false;ui.collapsed=true;}else{ui.expanded=true;}render();}
else if(a==='expand-row'){ui.openRows.has(id)?ui.openRows.delete(id):ui.openRows.add(id);const results=document.getElementById('pharmacy-results'),top=results.scrollTop;results.innerHTML=listHtml();results.scrollTop=top;}
else if(a==='bookmark'){ui.saved.has(id)?ui.saved.delete(id):ui.saved.add(id);render();}
else if(a==='toggle-favorites'){ui.favorites=!ui.favorites;ui.expanded=true;ui.collapsed=false;render();}else if(a==='all-pharmacies'){ui.favorites=false;render();}
else if(a==='zoom-in'||a==='zoom-out'){ui.zoom=Math.max(.8,Math.min(1.6,ui.zoom+(a==='zoom-in'?.2:-.2)));const bg=document.querySelector('.map-bg');bg.style.transform=`scale(${ui.zoom})`;}
else if(a==='mode'){state.mode=id;state.payment='pickup';render(true);}else if(a==='payment'){state.payment=id;render(true);}
else if(a==='increase'||a==='decrease'){if(a==='decrease'&&state.quantities[id]===1){removeProduct(id);return;}state.quantities[id]=Math.max(1,state.quantities[id]+(a==='increase'?1:-1));render(true);}
else if(a==='remove')removeProduct(id);else if(a==='restore'){clearTimeout(ui.removed[id]);delete ui.removed[id];render(true);}
else if(a==='add'){state.quantities[id]=(state.quantities[id]||0)+1;render(true);toast('Товар добавлен в корзину');}
else if(a==='favorite-product')toast('Товар добавлен в избранное');else if(a==='clear'){for(const t of Object.values(ui.removed))clearTimeout(t);ui.removed={};state.quantities={};render();}
else if(a==='reset'){state=initial();ui.removed={};navigate('cart',true);}
else if(a==='promo')promoDialog();else if(a==='remove-promo'){state.promo=false;render(true);}else if(a==='close-dialog')document.getElementById('overlay-root').innerHTML='';
else if(a==='submit'){if(!state.mode)return;const active=entries(),stock=active.filter(p=>p.id!=='sinus'),pre=active.filter(p=>p.id==='sinus');state.orders=state.mode==='split'?[{items:stock,preorder:false,discount:state.promo?200:0},{items:pre,preorder:true,discount:0}].filter(o=>o.items.length):[{items:chosenProducts(),preorder:state.mode==='together'&&pre.length>0,discount:state.promo?200:0}];for(const o of state.orders)for(const p of o.items)delete state.quantities[p.id];save();navigate('complete');}
else if(a==='complete')navigate('complete');else if(a==='orders')navigate('orders');else if(a==='bonus')toast('Бонус получен');else if(a==='cancel-order'){if(confirm('Отменить этот заказ?')){state.orders[Number(id)].cancelled=true;render(true);}}
});
function removeProduct(id){if(ui.removed[id])return;ui.removed[id]=setTimeout(()=>{delete state.quantities[id];delete ui.removed[id];render(true);},3000);render(true);}
window.addEventListener('popstate',()=>{ui.route=location.hash.slice(1)||'cart';if(ui.route==='complete'&&!state.orders)ui.route='cart';render();});
if(['cart','pharmacies','checkout','complete','orders'].includes(location.hash.slice(1)))ui.route=location.hash.slice(1);
if(['checkout','complete','orders'].includes(ui.route)&&!state.chosen)ui.route='cart';
render();
</script>
